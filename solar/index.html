<!DOCTYPE html>
<html lang="en">
    <head>
        <meta charset="utf-8">
        <meta name="viewport" content="width=device-width, initial-scale=1">
        <meta name="description" content="A simple tool that estimates solar panel energy production for any address">
        <meta name="keywords" content="solar, estimator, NREL, PVWatts">

        <title>Solar Potential Estimator</title>

        <link rel="preconnect" href="https://fonts.googleapis.com">
        <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
        <link href="https://fonts.googleapis.com/css2?family=DM+Sans:ital,opsz@0,9..40;1,9..40&family=Inter:ital,opsz,wght@0,14..32,100..900;1,14..32,100..900&family=Lexend+Deca:wght@100..900&family=Michroma&display=swap" rel="stylesheet">

        <!-- external CSS link -->
        <link rel="stylesheet" href="css/normalize.css">
        <link rel="stylesheet" href="css/style.css">
    </head>
    <body>

        <main class="page">

            <h1>Solar Potential Estimator</h1>
            <p class="subtitle">
                Enter a city and a system size to get a quick
                estimate of how much energy your solar panel can produce.
            </p>

            <form id="solar-form">

                <label for="address">City</label>
                <input type="text" id="address" name="address" placeholder="City" required>
                <label for="system-size">System Size (kW)</label>
                <input type="number" id="system-size" name="system-size" placeholder="Size" min="0.1" max="500000" step="0.1" required>
                <button type="submit">Get Estimate</button>

            </form>

            <div id="results"></div>

        </main>

        <script type="text/javascript" src="js/main.js"></script>
    </body>
</html>
